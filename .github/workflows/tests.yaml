name: Run tests
on: [push, pull_request]

jobs:
  run_pytests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          # Don’t ask the action to create your env
          activate-environment: base
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
          use-mamba: true            # important

      - name: Create env + install core deps
        shell: bash -l {0}
        run: |
          conda config --set channel_alias https://conda.anaconda.org
          mamba create -y -n emcpy python=3.10 pip pytest numpy scipy matplotlib cartopy shapely pyproj
          conda activate emcpy
          python -V
          python -c "import cartopy; import shapely; import pyproj; print('cartopy OK')"

      - name: Install package + extras (same env)
        shell: bash -l {0}
        run: |
          conda activate emcpy
          pip install -r requirements-github.txt
          pip install -e .

      - name: Run pytest
        shell: bash -l {0}
        env: { MPLBACKEND: Agg }
        run: |
          conda activate emcpy
          pytest -q

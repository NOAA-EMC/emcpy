name: Run tests
on: [push, pull_request]

jobs:
  run_pytests:
    runs-on: ubuntu-latest
    name: Install and run tests with pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Install and initialize Miniconda (don't rely on runner defaults)
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.10
          channels: conda-forge
          channel-priority: strict
          activate-environment: emcpy
          auto-activate-base: false

      - name: Create env and install deps
        shell: bash -l {0}
        run: |
          conda config --set channel_alias https://conda.anaconda.org
          conda install -y cartopy shapely pyproj numpy scipy matplotlib pip pytest
          python -c "import cartopy; print('cartopy', cartopy.__version__)"
      
      - name: Install package and extras (into the same env)
        shell: bash -l {0}
        run: |
          pip install -r requirements-github.txt
          pip install -e .

      - name: Run pytest
        shell: bash -l {0}
        env:
          MPLBACKEND: Agg
        run: pytest -q
